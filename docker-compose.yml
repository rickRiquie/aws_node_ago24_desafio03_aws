version: '3.8'

services:
  app:
    build: .
    command: npm start
    container_name: compasscar-api
    restart: always
    ports:
      - '3333:3333'
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: banco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'

volumes:
  db_data:
